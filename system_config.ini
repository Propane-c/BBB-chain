blocksize=16    
# MB.
consensus_type=consensus.BranchBound
target=000FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF
network_type=network.SynchronousNetwork